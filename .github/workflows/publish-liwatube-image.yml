name: نشر صورة خادم LiwaTube (Docker)

on:
  workflow_dispatch:
  push:
    tags:
      - "tube-server-v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: اختبار الخادم
        run: cd liwatube && npm install --no-audit --no-fund && npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liwatube:latest
            ghcr.io/${{ github.repository_owner }}/liwatube:${{ github.ref_name }}
