name: بناء LiwaTube للأندرويد (هاتف + تلفاز APK)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "وسم الإصدار الذي سيُنشر (مثال tube-android-v1.0.0)"
        required: true
        default: "tube-android-v1.0.0"
      server_url:
        description: "اختياري: رابط خادمك (مثل https://liwatube.up.railway.app) ليُضمَّن في التطبيق فلا يُطلب من المشاهدين"
        required: false
        default: ""
  push:
    tags:
      - "tube-android-v*"
    branches:
      - "claude/**"
    paths:
      - "liwatube/app/**"
      - "liwatube/web/**"
      - "liwatube/renderer/**"
      - "liwatube/electron/lib/recommend.js"
      - ".github/workflows/build-liwatube-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liwatube/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: تحديد وسم الإصدار
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}";
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}";
          else TAG="tube-android-v$(node -p "require('./package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "الوسم: $TAG"

      - name: تثبيت الاعتماديات
        run: npm install --no-audit --no-fund

      - name: تجميع واجهة الويب
        run: npm run build:www
        env:
          LIWATUBE_SERVER: ${{ github.event.inputs.server_url || vars.LIWATUBE_SERVER || '' }}

      - name: فحص التجميع
        run: npm test

      - name: توليد مشروع أندرويد
        run: npx cap add android

      - name: مزامنة ملفات الويب
        run: npx cap sync android

      - name: تهيئة المشروع (تلفاز + هاتف، اسم، إصدار)
        run: node scripts/patch-android.mjs android
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: توليد الأيقونات ولافتة التلفاز
        run: python3 scripts/make-icons.py android/app/src/main/res

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: توقيع APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/ks.jks
            KS=/tmp/ks.jks; KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; KS_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            KS=../../mobile/signing/liwamusic.jks; KS_PASS=liwamusic; KS_ALIAS=liwamusic
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" --out LiwaTube.apk aligned.apk
          "$BT/apksigner" verify --print-certs LiwaTube.apk
          ls -la LiwaTube.apk

      - name: رفع الـ APK كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: LiwaTube-APK
          path: liwatube/app/LiwaTube.apk
          if-no-files-found: error

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LiwaTube للأندرويد ${{ steps.tag.outputs.tag }}
          files: liwatube/app/LiwaTube.apk
          body: |
            ## LiwaTube للهاتف والتلفاز — APK واحد للاثنين

            نزّل `LiwaTube.apk` وثبّته على هاتفك أو على تلفاز أندرويد (Android TV / Google TV /
            أي شاشة تدعم تثبيت APK). سيطلب السماح بالتثبيت من مصدر غير معروف — هذا طبيعي.

            **عند أول تشغيل** أدخل عنوان خادم LiwaTube (مثل `http://192.168.1.10:8787` داخل الشبكة،
            أو رابط خادمك على الإنترنت) — إلا إذا بُني التطبيق برابط مضمَّن فيفتح مباشرة.
            كل ما يرفعه المشرف يظهر فورًا للجميع. يدعم الهواتف القابلة للطي وتقسيم الشاشة.

            على التلفاز: التنقّل بأسهم الريموت، OK للتشغيل، Back للرجوع.

            ---
            تم إنشاؤه عن طريق **LiwaMusic**
