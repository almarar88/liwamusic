name: بناء LiwaTube لويندوز

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "وسم الإصدار الذي سيُنشر (مثال tube-v1.0.0)"
        required: true
        default: "tube-v1.0.0"
  push:
    tags:
      - "tube-v*"
    branches:
      - "claude/**"
    paths:
      - "liwatube/electron/**"
      - "liwatube/renderer/**"
      - "liwatube/server/**"
      - "liwatube/web/**"
      - "liwatube/package.json"
      - "liwatube/electron-builder.yml"
      - ".github/workflows/build-liwatube.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: liwatube

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تحديد وسم الإصدار
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}";
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}";
          else TAG="tube-v$(node -p "require('./package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "الوسم: $TAG"

      - name: تثبيت الاعتماديات
        run: npm install --no-audit --no-fund

      - name: الاختبار الذاتي
        run: npm test

      - name: بناء ملف التثبيت
        run: npm run dist:win

      - name: رفع ملف التثبيت كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: LiwaTube-Setup-Windows
          path: liwatube/release/LiwaTube-Setup-*.exe
          if-no-files-found: error

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LiwaTube ${{ steps.tag.outputs.tag }}
          files: liwatube/release/LiwaTube-Setup-*.exe
          body: |
            ## LiwaTube — يوتيوبك الخاص، محلي ومدعوم بالذكاء الاصطناعي

            ملف تثبيت لويندوز (64-بت). نزّل `LiwaTube-Setup-*.exe` وشغّله
            واتبع خطوات التثبيت (يُثبَّت للمستخدم الحالي بلا صلاحيات مدير).

            أضف مجلد فيديوهاتك ليبدأ العرض: فهرسة، صور مصغّرة، قنوات من المجلدات،
            توصيات محلية، Shorts، سجل، شاهد لاحقًا، قوائم تشغيل.

            **مشاركة مع الآخرين:** صفحة «مشاركة» تشغّل خادمًا من مكتبتك وتعرض رمز QR
            يمسحه الهاتف بتطبيق LiwaTube، وزر «مشاركة على الإنترنت» يعطيك رابطًا للجميع.

            ميزات الذكاء الاصطناعي **مغلقة افتراضيًا** (تحتاج مفتاح Anthropic API مدفوعًا)،
            وتُفعَّل من: الإعدادات ← الذكاء الاصطناعي.

            > قد يُظهر ويندوز تنبيه SmartScreen لأن الملف غير موقّع رقميًا —
            > اختر «مزيد من المعلومات» ثم «تشغيل على أي حال».

            ---
            تم إنشاؤه عن طريق **LiwaMusic**
