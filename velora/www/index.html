<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#04060d">
  <title>Velora</title>
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div id="lock" class="lock">
    <div class="lock-logo"><span class="logo-mark">V</span><span class="logo-word">VELORA</span></div>
    <div class="lock-hi" id="lockHi">Welcome back</div>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="pin-hint">Demo PIN 1234 · or tap the fingerprint</div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <button class="avatar rp" id="btnProfile" aria-label="Profile">AM</button>
      <div class="top-mid">
        <div class="top-hello" id="hello">Good day</div>
        <div class="top-name">Velora <span class="demo-pill">DEMO</span></div>
      </div>
      <button class="icon-btn glass rp" id="btnBell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot" id="bellDot"></span></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" id="tabs">
      <div class="tab-ind" id="tabInd"></div>
      <button data-tab="home" class="on"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg></span>Home</button>
      <button data-tab="cards"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/></svg></span>Cards</button>
      <button data-tab="pay" class="pay"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3"/><path d="M17 17H5l3 3"/></svg></span>Transfer</button>
      <button data-tab="invest"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Invest</button>
      <button data-tab="insights"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Insights</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden"><div class="sheet-bg" data-close></div><div class="sheet-body" id="sheetBody"></div></div>
  <div id="toast" class="toast"></div>
  <canvas id="fx"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
