<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b16">
  <title>Velora</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="lock" class="lock">
    <div class="lock-logo"><span class="logo-mark">V</span><span class="logo-word">Velora</span></div>
    <div class="lock-hi">Welcome back</div>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="pin-hint">Demo PIN: 1234</div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <button class="avatar" id="btnProfile" aria-label="Profile">AM</button>
      <div class="top-mid">
        <div class="top-hello" id="hello">Good day</div>
        <div class="top-name">Velora <span class="demo-pill">DEMO</span></div>
      </div>
      <button class="icon-btn" id="btnBell" aria-label="Notifications">🔔<span class="dot" id="bellDot"></span></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" id="tabs">
      <button data-tab="home" class="on"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>Home</button>
      <button data-tab="cards"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg></span>Cards</button>
      <button data-tab="pay" class="pay"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3"/><path d="M17 17H5l3 3"/></svg></span>Transfer</button>
      <button data-tab="invest"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Invest</button>
      <button data-tab="insights"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></span>Insights</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden"><div class="sheet-bg" data-close></div><div class="sheet-body" id="sheetBody"></div></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
